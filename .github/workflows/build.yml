# Baut bei jedem Push auf den Branch "plus" automatisch eine signierte APK
# und veröffentlicht sie unter "Releases". Die eigentliche Logik steckt in
# ci/build.sh, damit diese Datei möglichst nie geändert werden muss.
name: APK bauen

on:
  push:
    branches: [plus]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: APK bauen und veröffentlichen
        run: bash ci/build.sh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
