# Baut bei jedem Push auf den Branch "plus" automatisch eine signierte APK
# und veröffentlicht sie unter "Releases" (Job "build", Logik in ci/build.sh).
#
# Zusätzlich wird die App bei jedem Push auf "plus" oder "dev" auf einem
# virtuellen Handy durchgeklickt (Job "smoke", Logik in ci/smoke.sh).
# Ergebnis und Bildschirmfotos liegen danach auf dem Branch "ci-smoke".
# Auf "dev" entsteht kein Release – dort werden Zwischenstände geprüft.
name: APK bauen

on:
  push:
    branches: [plus, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/plus'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: APK bauen und veröffentlichen
        run: bash ci/build.sh
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      # Platz für Build, virtuelles Handy und KI-Modell (2,6 GB): vorinstallierte, hier
      # nicht gebrauchte Werkzeuge entfernen (Android-SDK und Java bleiben).
      - name: Speicher freimachen
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby || true
          df -h /

      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test-APKs bauen
        run: bash ci/smoke-build.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}

      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Auf virtuellem Handy durchklicken
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 8192M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash ci/smoke.sh
