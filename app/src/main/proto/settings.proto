syntax = "proto3";
option java_package = "com.helddertierwelt.mentalmath";
option java_multiple_files = true;

message SettingsStateProto {
  bool is_mode_enabled = 1;
  float limit = 2;

  float plus_min = 3;
  float plus_max = 4;

  float minus_min = 5;
  float minus_max = 6;

  float multiply_min = 7;
  float multiply_max = 8;

  float divide_min = 9;
  float divide_max = 10;

  bool is_plus_enabled = 11;
  bool is_minus_enabled = 12;
  bool is_multiply_enabled = 13;
  bool is_divide_enabled = 14;

  bool is_sheet_open = 15;

  enum ThemeMode {
    SYSTEM = 0;
    LIGHT = 1;
    DARK = 2;
  }
  ThemeMode theme_mode = 16;

  enum InputMode {
    PHONE_KEYPAD = 0;
    NUMBER_PAD  = 1;
  }
  InputMode input_mode = 17;

  enum InputDirectionMode {
    LEFT_TO_RIGHT = 0;
    RIGHT_TO_LEFT  = 1;
  }
  InputDirectionMode input_direction_mode = 18;

  enum NotificationMode {
    OFF = 0;
    DAILY = 1;
    THREEDAILY = 2;
    WEEKLY = 3;
  }
  NotificationMode notification_mode = 19;

  enum SoundMode {
    SOUND_OFF = 0;
    SOUND_ON = 1;
  }
  SoundMode sound_mode = 20;

  enum FormMode {
    HORIZONTAL = 0;
    VERTICAL  = 1;
  }
  FormMode form_mode = 21;

  enum VibrationMode {
    VIBRATION_OFF = 0;
    VIBRATION_ON = 1;
  }
  VibrationMode vibration_mode = 22;

}