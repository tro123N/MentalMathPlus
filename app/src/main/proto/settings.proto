syntax = "proto3";
option java_package = "com.helddertierwelt.mentalmath101";
option java_multiple_files = true;

message SettingsStateProto {
  bool is_mode_enabled = 1;
  float limit = 2;

  bool is_plus_enabled = 3;
  bool is_minus_enabled = 4;
  bool is_multiply_enabled = 5;
  bool is_divide_enabled = 6;

  bool is_sheet_open = 7;

  enum ThemeMode {
    SYSTEM = 0;
    LIGHT = 1;
    DARK = 2;
  }

  ThemeMode theme_mode = 8;
  bool is_active_score_default = 9;
  bool is_numpad_default = 10;
  bool is_right_to_left = 11;

  enum NotificationMode {
    OFF = 0;
    DAILY = 1;
    THREEDAILY = 2;
    WEEKLY = 3;
  }

  NotificationMode notification_mode = 12;
}